<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book Library</title>

    <!-- Bootstrap CSS only -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1"> 📚 Book Library </span>
      </div>
    </nav>

    <main class="container py-4">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1>My Books</h1>
          <p class="text-muted">Manage your read and unread books.</p>
        </div>

        <button class="btn btn-primary" id="addBookButton">+ Add Book</button>
      </div>

      <!-- Filters -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="statusFilter" class="form-label">
                Filter by status
              </label>

              <select id="statusFilter" class="form-select">
                <option value="">All Books</option>
                <option value="Read">Read</option>
                <option value="Unread">Unread</option>
              </select>
            </div>

            <div class="col-md-8">
              <label for="searchInput" class="form-label"> Search </label>

              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by title or author..."
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <div id="loadingMessage" class="text-center py-5">Loading books...</div>

      <!-- Error -->
      <div id="errorMessage" class="alert alert-danger d-none"></div>

      <!-- Books -->
      <div id="booksContainer" class="row g-4"></div>

      <!-- No books -->
      <div id="noBooksMessage" class="text-center py-5 d-none">
        <h4>No books found</h4>
        <p class="text-muted">Try changing your filter or add a new book.</p>
      </div>
    </main>

    <!-- Add Book Modal -->
    <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Book</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <form id="bookForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="title" class="form-label"> Title </label>

                <input type="text" id="title" class="form-control" required />
              </div>

              <div class="mb-3">
                <label for="author" class="form-label"> Author </label>

                <input type="text" id="author" class="form-control" required />
              </div>

              <div class="mb-3">
                <label for="status" class="form-label"> Status </label>

                <select id="status" class="form-select" required>
                  <option value="Unread">Unread</option>

                  <option value="Read">Read</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">
                  Description
                </label>

                <textarea
                  id="description"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

              <button type="submit" class="btn btn-primary">Add Book</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Book Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="detailsTitle">Book Details</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body" id="detailsContent"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS is intentionally NOT used -->

    <script src="/js/app.js"></script>
  </body>
</html>
